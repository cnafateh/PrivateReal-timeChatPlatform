services:
  web:
    build: .
    container_name: chatapp_web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    environment:
      - DJANGO_SETTINGS_MODULE=chatapp_project.settings
      - DEBUG=True
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: chatapp_nginx
    ports:
      - "80:80"
    volumes:
      - static_volume:/static
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    restart: unless-stopped

volumes:
  static_volume: