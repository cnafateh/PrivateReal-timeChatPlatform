name: Android APK

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
    tags: [android-v*]
    paths:
      - android/**
      - .github/workflows/android-apk.yml
  pull_request:
    paths:
      - android/**
      - .github/workflows/android-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PULSE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      PULSE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PULSE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PULSE_STORE_TYPE: pkcs12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build installable APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Verify APK signature and package
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -n "$APKSIGNER" && test -n "$AAPT"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          "$AAPT" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          test -n "$PULSE_STORE_PASSWORD" && test -n "$PULSE_KEY_ALIAS" && test -n "$PULSE_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          export PULSE_KEYSTORE_FILE="$GITHUB_WORKSPACE/android/release.keystore"
          gradle -p android :app:assembleRelease --no-daemon
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk
      - name: Upload signed release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: pulse-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  install-check:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: pulse-android-apk
          path: dist
      - uses: actions/download-artifact@v4
        if: env.HAS_RELEASE_KEY != ''
        with:
          name: pulse-android-release-apk
          path: dist/release
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            adb install -r dist/app-debug.apk
            adb shell pm path ir.sinafateh.pulse
            test ! -f dist/release/app-release.apk || (adb uninstall ir.sinafateh.pulse && adb install -r dist/release/app-release.apk && adb shell pm path ir.sinafateh.pulse)

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/android-v')
    needs: [apk, install-check]
    runs-on: ubuntu-latest
    concurrency:
      group: android-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require permanent signing key
        run: |
          test -n "$HAS_RELEASE_KEY" || { echo 'Configure the four Android signing secrets before publishing a release.'; exit 1; }
      - name: Resolve and validate release tag
        id: release_details
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Run the manual release from the main branch.'
            exit 1
          fi
          version=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo '::error::Android versionName is missing or invalid.'
            exit 1
          fi
          tag="android-v$version"
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Android versionName $version."
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          if git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            tagged_commit=$(git rev-parse "refs/tags/$tag^{commit}")
            if [[ "$tagged_commit" != "$commit" ]]; then
              echo "::error::$tag already points to another commit. Increase versionName and versionCode before releasing."
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: pulse-android-release-apk
          path: dist/release
      - name: Publish APK to GitHub Releases
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.release_details.outputs.tag }}
        run: |
          test -n "$HAS_RELEASE_KEY"
          cp dist/release/app-release.apk "Pulse-$TAG.apk"
          printf 'Signed Android release. Future updates use the same signing key. Existing CI preview builds require a one-time reinstall because their temporary signatures differ.\n' > release-notes.txt
          apk=$(find . -maxdepth 1 -name 'Pulse-*.apk' -print -quit)
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --repo "$REPOSITORY" --clobber
          else
            gh release create "$TAG" "$apk" --repo "$REPOSITORY" --target "$(git rev-parse HEAD)" --title "Pulse Android $TAG" --notes-file release-notes.txt
          fi
