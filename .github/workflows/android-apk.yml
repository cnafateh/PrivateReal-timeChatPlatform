name: Android APK

on:
  push:
    branches: [main, feature/android-app]
    paths:
      - android/**
      - .github/workflows/android-apk.yml
  pull_request:
    paths:
      - android/**
      - .github/workflows/android-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PULSE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      PULSE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PULSE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build installable APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          echo "PULSE_KEYSTORE_FILE=$GITHUB_WORKSPACE/android/release.keystore" >> "$GITHUB_ENV"
          gradle -p android :app:assembleRelease --no-daemon
      - name: Upload signed release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: pulse-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
