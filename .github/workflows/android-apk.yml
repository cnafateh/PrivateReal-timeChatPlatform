name: Android APK

on:
  push:
    branches: [main, feature/android-app]
    tags: [android-v*]
    paths:
      - android/**
      - .github/workflows/android-apk.yml
  pull_request:
    paths:
      - android/**
      - .github/workflows/android-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PULSE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      PULSE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PULSE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build installable APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Verify APK signature and package
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -n "$APKSIGNER" && test -n "$AAPT"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          "$AAPT" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          echo "PULSE_KEYSTORE_FILE=$GITHUB_WORKSPACE/android/release.keystore" >> "$GITHUB_ENV"
          gradle -p android :app:assembleRelease --no-daemon
      - name: Upload signed release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: pulse-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  install-check:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: pulse-android-apk
          path: dist
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            adb install -r dist/app-debug.apk
            adb shell pm path ir.sinafateh.pulse

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: [apk, install-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pulse-android-apk
          path: dist/debug
      - uses: actions/download-artifact@v4
        if: env.HAS_RELEASE_KEY != ''
        with:
          name: pulse-android-release-apk
          path: dist/release
      - name: Publish APK to GitHub Releases
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -n "$HAS_RELEASE_KEY" ]; then
            cp dist/release/app-release.apk "Pulse-$TAG.apk"
            printf 'Signed Android release. Keep the signing key for future updates.\n' > release-notes.txt
            preview=''
          else
            cp dist/debug/app-debug.apk "Pulse-$TAG-preview.apk"
            printf 'Installable preview APK. This build uses a temporary CI signing key. Uninstall an earlier preview with a different signature before installing it; this removes local app data. Production updates require the persistent signing secrets described in docs/ANDROID.md.\n' > release-notes.txt
            preview='--prerelease'
          fi
          apk=$(find . -maxdepth 1 -name 'Pulse-*.apk' -print -quit)
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --repo "$REPOSITORY" --clobber
          else
            gh release create "$TAG" "$apk" --repo "$REPOSITORY" --title "Pulse Android $TAG" --notes-file release-notes.txt $preview
          fi
