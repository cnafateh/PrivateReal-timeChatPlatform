{% load static %}

<!doctype html>

<html lang="en" dir="ltr">

<head>

    <meta charset="utf-8">
    {% if user.is_authenticated %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#080b14"
    >

    <title>
        {% block title %}
            Pulse
        {% endblock %}
    </title>

    <link
    rel="icon"
    type="image/png"
    href="{% static 'images/favicon.png' %}"
>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/app.css' %}"
    >

    <script src="{% static 'js/theme.js' %}"></script>
    <link rel="stylesheet" href="{% static 'css/enhancements.css' %}">
    {% block head %}
    {% endblock %}

</head>

<body class="{% block body_class %}{% endblock %}">

    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">◐</button>
    {% block content %}
    {% endblock %}

    <script src="{% static 'js/avatars.js' %}" defer></script>
    <script src="{% static 'js/viewport.js' %}" defer></script>
    {% if user.is_authenticated %}<script src="{% static 'js/inbox.js' %}" defer></script>{% endif %}
    {% block scripts %}
    {% endblock %}

</body>

</html>
