{% load static %}
<aside class="sidebar">
    <div class="sidebar-head">
        <div class="brand-row">
            <a href="{% url 'inbox' %}" class="brand"><span class="brand-mark"><img src="{% static 'images/favicon.png' %}" alt=""></span> Pulse</a>
            <a class="icon-button" href="{% url 'search_user' %}" aria-label="New chat" title="New chat">＋</a>
        </div>
        <a href="{% url 'search_user' %}" class="search-field">Search or start a conversation →</a>
    </div>
    <div class="section-label">Your conversations</div>
    {% include 'chat/conversation_list.html' %}
    <div class="sidebar-footer"><div class="profile-mini">
        <a href="{% url 'profile_detail' user.profile.public_id %}" aria-label="My profile">{% include "chat/avatar.html" with person=user size="small" %}</a>
        <div class="user-copy"><a href="{% url 'profile_detail' user.profile.public_id %}"><strong>{{ user.profile.display_name }}</strong><span>@{{ user.username }}</span></a></div>
        <form action="{% url 'logout' %}" method="post">{% csrf_token %}<button class="icon-button" title="Log out" aria-label="Log out">↗</button></form>
    </div></div>
</aside>
